name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a problem. Share whatever details you have; optional fields can be left blank."
  - type: input
    id: dkit-version
    attributes:
      label: dkit version
      description: "Run `dkit --version`."
      placeholder: "dkit 0.3.0"
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "Python 3.12.1"
    validations:
      required: false
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Include the command and any arguments you ran.
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: What happened instead? Include any error message.
    validations:
      required: false
